            - uuid: b22a1111b2224333a444e555f666888e
              name: '{#SERVER_NAME} {#GPU_MODEL} {#GPU_ID} Utilization - Min (10m)'
              type: TRAP
              key: 'gpu.utilization.bucketmin[{#COMPOSITE_ID}]'
              delay: '0'
              value_type: FLOAT
              units: '%'
            - uuid: 3c3d6e8e142f4a3ba0a7f8091a2b3c4e
              name: '{#SERVER_NAME} {#GPU_MODEL} {#GPU_ID} Utilization - Avg (10m)'
              type: TRAP
              key: 'gpu.utilization[{#COMPOSITE_ID}]'
              delay: '0'
              value_type: FLOAT
              units: '%'
          master_item:
            key: intersight.gpus
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var out = [];
                  
                  for (var i = 0; i < data.Results.length; i++) {
                      var gpu = data.Results[i];
                      var blade = "";
                  
                      if (gpu.Ancestors) {
                          for (var j = 0; j < gpu.Ancestors.length; j++) {
                              if (gpu.Ancestors[j].ObjectType === "compute.Blade") {
                                  blade = gpu.Ancestors[j].Moid;
                                  break;
                              }
                          }
                      }
                  
                      var model = gpu.Model;
                      if (!model || model === "") {
                          model = "Unknown-GPU";
                      }
                  
                      var ctrlCount = 0;
                      if (gpu.GraphicsControllers &&
                          Object.prototype.toString.call(gpu.GraphicsControllers) === '[object Array]') {
                          ctrlCount = gpu.GraphicsControllers.length;
                      }
                  
                      if (ctrlCount > 1) {
                          for (var c = 1; c <= ctrlCount; c++) {
                              out.push({
                                "{#SERVER_NAME}": gpu.ServerName,
                                "{#GPU_ID}": gpu.GpuId + "_C" + c, 
                                "{#GPU_MODEL}": model,
                                "{#GPU_MOID}": gpu.Moid,
                                "{#BLADE_MOID}": blade,
                                "{#GPU_CARD_ID}": gpu.GpuId,
                                "{#CTRL_ID}": String(c),
                                "{#CTRL_COUNT}": String(ctrlCount),
                                "{#COMPOSITE_ID}": blade + "_" + gpu.GpuId + "_C" + c
                              });
                          }
                      } else {
                          out.push({
                            "{#SERVER_NAME}": gpu.ServerName,
                            "{#GPU_ID}": gpu.GpuId,
                            "{#GPU_MODEL}": model,
                            "{#GPU_MOID}": gpu.Moid,
                            "{#BLADE_MOID}": blade,
                            "{#GPU_CARD_ID}": gpu.GpuId,
                            "{#CTRL_ID}": "",
                            "{#CTRL_COUNT}": String(ctrlCount > 0 ? ctrlCount : 1),
                            "{#COMPOSITE_ID}": blade + "_" + gpu.GpuId
                          });
                      }
                  }
                  
                  return JSON.stringify(out);
      macros:
